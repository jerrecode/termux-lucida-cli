name: Python offline checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Compile all Python sources
        run: python -m compileall -q termux_lucida.py tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed console script
        run: |
          termux-lucida --version
          termux-lucida doctor
