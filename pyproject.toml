[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-lucida-cli"
version = "0.1.0"
description = "Lightweight browser-free Lucida CLI designed for native Termux on Android"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jerrecode"}]
dependencies = ["json5>=0.9,<1.0"]
keywords = ["termux", "android", "lucida", "music", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Operating System :: Android"]

[project.scripts]
termux-lucida = "termux_lucida:main"

[project.urls]
Homepage = "https://github.com/jerrecode/termux-lucida-cli"

[tool.setuptools]
py-modules = ["termux_lucida"]
